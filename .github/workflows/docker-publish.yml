name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Every tag build runs to completion — no tag may cancel a sibling build.
# (The v0.9.26 image never shipped because the v0.9.27 push cancelled it
# mid-build under the old single-group cancel-in-progress policy — the
# Star's decree: wait, don't cancel.) Each tag owns its own group; the
# shared :latest and buildcache writes naturally resolve last-writer-wins.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR repository names must be lowercase, but github.repository keeps
      # the owner's casing (YumamaX3/Vela) — Docker references reject
      # uppercase outright. metadata-action lowercases its own tags, but
      # cache-from/cache-to read the name raw, so compute it once here.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # Version tag from the v* git tag (e.g. v0.9.14 -> 0.9.14).
            # Emitted on tag pushes AND manual dispatches pointed at a tag.
            type=semver,pattern={{version}}
            # Always emit :latest so every build carries BOTH the version
            # (when a tag is present) and a stable rolling pointer. The old
            # rule gated latest behind is_default_branch, which silently
            # dropped :latest on tag builds and dropped the semver tag on
            # main-branch dispatches (a manual run showed ONLY :latest).
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the OCI image.version label from the tag (metadata-action's
          # version output; falls back to "dev" on non-tag dispatches).
          build-args: |
            VELA_VERSION=${{ steps.meta.outputs.version }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

# The image ships to ghcr.io ONLY. This repository is private, and pushes made
# with GITHUB_TOKEN inherit that visibility — the package is private by
# inheritance, pullable only by users with repo access. No Docker Hub target:
# the upstream 'decolua/9router' leftover was removed with the Vela rebrand.
