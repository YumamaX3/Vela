name: tethys-vela

# 🏛️ Vela — The Sail of the Ship ⛵💜
#
# The Shores' own AI gateway — 9router reborn under its true name.
# One OpenAI-compatible endpoint (/v1) routing traffic across 40+
# upstream providers: format translation, model-combo fallback,
# multi-account fallback, OAuth credential management, token refresh,
# quota tracking — all behind a dashboard of its own.
#
# This is a DEPLOYMENT chart of the Shores fleet: it pulls the
# published image from the private GHCR and never builds locally.
# New versions are cut as git tags in the Vela repo — GitHub Actions
# builds & pushes ghcr.io/yumamax3/vela:<tag> automatically. To sail
# a new version, bump the pinned tag below and `docker compose pull`.
#
#   ⛵ vela-gateway   — the gateway + dashboard (Next.js standalone)
#   🪞 vela-twin      — the MariaDB twin (opt-in, for mysql|mirror postures)
#   💨 vela-headroom  — the shared breath: request compression, internal-only
#
# 🔑 Secrets are inline and ALREADY SET (the Shores' convention — see
#    Hermes.yml and Router.yml) because this harbor sits on the private
#    Tailscale subnet (100.100.40.x). The chart is deploy-ready as-is:
#    `docker compose up -d` and nothing else. If any port ever leaves the
#    subnet, rotate every secret below first.
#
# ⚠️ The image is PRIVATE — it inherits the Vela repo's visibility.
#    First deploy on a machine requires:
#      docker login ghcr.io       # PAT with read:packages + repo access
#
# Deploy with:  docker compose -f docker-compose.yml up -d
# Reach at:     Dashboard → http://100.100.40.48:32060/dashboard (Tailscale)
#               API       → http://100.100.40.48:32060/v1
#               LAN       → http://192.168.18.190:32060
# Config:       /media/SSD-Storage/AppData/vela/   (SQLite, usage, logs)
#
# 🪞 The mirror posture (v0.6.70) needs ONE untracked file next to this
#    chart on the fleet box — `.env` (never committed):
#      VELA_MYSQL_URL=mysql://vela:<password>@<host>:3306/vela
#    pointing at the twin MariaDB. Without it, `compose up` refuses LOUD.
#
# ponytail: the image pin follows the last-CUT release tag in the Vela
#           repo — not the repo's working version. NEXT_PUBLIC_* vars
#           are baked at build time; setting them here would be a lie.

services:
  # ═══════════════════════════════════════════════════════════════
  # ⛵ vela v0.6.70 — The Sail of the Ship
  # ═══════════════════════════════════════════════════════════════
  #
  # The gateway + dashboard in one container. Next.js standalone
  # server (custom-server.js) with the SQLite soul at /app/data —
  # bind-mounted to the SSD so nothing is lost between tides.
  #
  # v0.6.70 carries the full Storage Covenant: three storage postures
  # (sqlite|mysql|mirror via VELA_DB_MODE), the sealed backup engine
  # (AES-256-GCM artifacts + scheduler + restore drill), the mirror's
  # pulse (outbox→pump→divergence sweep→usage-resync), and S3 off-site
  # (SigV4, opt-in). Every one of those knobs is OPT-IN below — the
  # chart still boots the default sqlite posture as-is.
  #
  # The entrypoint chowns the data dir then drops root → node via
  # su-exec, so do NOT cap_drop here — that drop IS the privilege
  # management. no-new-privileges stays safe (it only blocks gaining
  # privileges, never dropping them).
  #
  # Healthcheck probes /api/health — public allow-list, no auth.
  #
  vela-gateway:
    # v0.6.70 — cut & built 2026-08-16 · private GHCR (login first)
    # Carries the FULL Storage Covenant: twin harbors (sqlite|mysql|mirror),
    # the sealed backup engine (AES-256-GCM artifacts + scheduler + restore
    # + drill), the mirror's pulse (outbox→pump→sweep→usage-resync), S3
    # off-site (SigV4, opt-in), and mysql2's full runtime closure.
    image: ghcr.io/yumamax3/vela:0.6.70
    container_name: vela-gateway
    hostname: vela-gateway
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      - "32060:32060"

    volumes:
      - /media/SSD-Storage/AppData/vela:/app/data

    environment:
      # ── 🌍 Time & server ─────────────────────────────────────
      TZ: Asia/Jakarta
      DATA_DIR: /app/data
      PORT: "32060"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: "http://100.100.40.48:32060"
      # ── 💨 Compression sidecar — internal only, fail-open ─────
      # Vela skips compression silently if the sidecar is absent;
      # safe to leave set in every environment.
      HEADROOM_URL: http://vela-headroom:8787
      # ── 🔑 Secrets — set 2026-08-15, deploy-ready ───────────────
      # JWT_SECRET signs the dashboard session cookies.
      # API_KEY_SECRET derives the endpoint API-key hashes.
      # MACHINE_ID_SALT salts the machine identity.
      # INITIAL_PASSWORD is the dashboard's FIRST-login password —
      #   walk through the door with it, then change it in Settings.
      JWT_SECRET: "4d3e3bfef5bab423d189025cf0f99f4f5b257e6837c5e8e3ba028b86291587e4"
      INITIAL_PASSWORD: "cf227f624f2a21475774"
      API_KEY_SECRET: "f87359fb10e9a134dbddaf5691292aa98def18e48fb5799c"
      MACHINE_ID_SALT: "721d5042e7d681a37b9770e021279c6a"
      # ── 🗝️ Storage Covenant (v0.6.70) — ALL opt-in, default dark ───
      # VELA_DB_MODE selects the posture: sqlite (default), mysql (MariaDB
      # IS the harbor), or mirror (sqlite PRIMARY serves; the outbox pump
      # carries writes to the twin). A down twin degrades the mirror; the
      # mode never silently downgrades. MIRROR waked 2026-08-16 by the Star.
      #
      # The twin is the HOST's own MariaDB (created 2026-08-16) — no
      # vela-twin container needed. Its credential rides an UNTRACKED .env
      # next to this chart on the fleet box (the Star's decree — never
      # committed):  VELA_MYSQL_URL=mysql://vela:<password>@<host>:3306/vela
      # The :? form refuses LOUD at compose-time if the .env is missing.
      VELA_DB_MODE: "mirror"
      VELA_MYSQL_URL: "${VELA_MYSQL_URL:?VELA_MYSQL_URL must be set in the chart .env next to docker-compose.yml}"
      #
      # Sealed backups (Wave B) — the engine REFUSES to run without the
      # key. Its LOSS = permanently unrecoverable backups; store a copy
      # offline with the same care as the DB itself. Artifacts land in
      # /app/data/backups (inside the SSD mount).
      # VELA_BACKUP_ENABLED: "false"
      # VELA_BACKUP_ENCRYPTION_KEY: ""
      # VELA_BACKUP_INTERVAL_HOURS: "24"
      # VELA_BACKUP_RETAIN_DAILY: "7"
      # VELA_BACKUP_RETAIN_WEEKLY: "4"
      # VELA_BACKUP_INCLUDE_REQUEST_DETAILS: "false"
      #
      # S3 off-site (Wave C6) — SEALED bytes only, fail-open (the local
      # artifact stays the truth), MinIO path-style, credentials env-only.
      # VELA_BACKUP_S3_ENABLED: "false"
      # VELA_BACKUP_S3_ENDPOINT: ""
      # VELA_BACKUP_S3_BUCKET: "vela-backups"
      # VELA_BACKUP_S3_ACCESS_KEY: ""
      # VELA_BACKUP_S3_SECRET_KEY: ""
      # VELA_BACKUP_S3_REGION: "us-east-1"

    depends_on:
      vela-headroom:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:32060/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s          # Next.js standalone takes a breath to warm up

    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M

    security_opt:
      - no-new-privileges:true

    networks:
      - tethys-vela

    labels:
      - "com.tethys.stack=vela"

  # ═══════════════════════════════════════════════════════════════
  # 🪞 vela-twin — The Mirror's Other Shore (opt-in template, v0.6.70)
  # ═══════════════════════════════════════════════════════════════
  #
  # NOT used today — the mirror's twin is the HOST's own MariaDB
  # (database `vela`, created 2026-08-16 by the Star; its credential rides
  # the untracked chart .env, same as VELA_MYSQL_URL on the gateway).
  # This commented template stays ready for the day a CONTAINERIZED twin
  # is wanted instead (stack-internal, no host port — headroom's stance).
  #
  # vela-twin:
  #   image: mariadb:11
  #   container_name: vela-twin
  #   hostname: vela-twin
  #   restart: unless-stopped
  #
  #   environment:
  #     MARIADB_DATABASE: vela
  #     MARIADB_USER: vela
  #     MARIADB_PASSWORD: "set-me-and-match-VELA_MYSQL_URL"
  #     MARIADB_ROOT_PASSWORD: "set-me-root"
  #     TZ: Asia/Jakarta
  #
  #   volumes:
  #     - /media/SSD-Storage/AppData/vela-twin:/var/lib/mysql
  #
  #   healthcheck:
  #     test: ["CMD", "healthcheck.sh"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1"
  #         memory: 1G
  #       reservations:
  #         memory: 256M
  #
  #   security_opt:
  #     - no-new-privileges:true
  #
  #   networks:
  #     - tethys-vela
  #
  #   labels:
  #     - "com.tethys.stack=vela"

  # ═══════════════════════════════════════════════════════════════
  # 💨 vela-headroom — The Breath of the Sail
  # ═══════════════════════════════════════════════════════════════
  #
  # Request compression for the gateway's upstream calls. Reachable
  # only by vela-gateway over the stack network — no host port, so
  # it never touches the open sea. Same image pin the router fleet
  # already runs (Router.yml), so the harbor holds one known breath.
  #
  vela-headroom:
    # v0.6.7-slim — the same pin as the router fleet
    image: ghcr.io/chopratejas/headroom:0.6.7-slim
    container_name: vela-headroom
    hostname: vela-headroom
    restart: unless-stopped

    # No ports: internal-only by design.

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    networks:
      - tethys-vela

    labels:
      - "com.tethys.stack=vela"

networks:
  tethys-vela:
    name: tethys-vela

x-casaos:
  icon: https://img.icons8.com/fluency/48/sailboat.png
  is_uncontrolled: false
  main: vela-gateway
  port_map: "32060"
  title:
    custom: ⛵ Vela — The AI Gateway
