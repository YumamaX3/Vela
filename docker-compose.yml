services:
  vela:
    image: vela:latest
    container_name: vela
    restart: always
    ports:
      - "32060:32060"
    volumes:
      - vela-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "32060"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  vela-data:
    name: vela-data
